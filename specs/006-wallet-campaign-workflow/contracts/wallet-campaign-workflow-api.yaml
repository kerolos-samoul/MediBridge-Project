openapi: 3.0.3
info:
  title: MediBridge Wallet and Campaign Workflow API
  version: 1.0.0
  description: >-
    Public secured HTTP contract for company wallet mock top-up, campaign draft
    and asset workflows, admin doctor pricing, asset/campaign moderation, and
    queue verification.
servers:
  - url: https://api.medibridge.local
paths:
  /api/company/wallet:
    get:
      summary: Get or repair the approved company's active wallet
      operationId: getCompanyWallet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active company wallet returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCompanyWallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/company/wallet/mock-checkout:
    post:
      summary: Start a mock top-up checkout that succeeds immediately
      operationId: createMockTopUp
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockTopUpRequest'
      responses:
        '200':
          description: Mock payment succeeded and wallet was credited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeMockPayment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/company/campaigns:
    post:
      summary: Create an owned draft campaign
      operationId: createCampaignDraft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignDraftRequest'
      responses:
        '201':
          description: Draft campaign created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCampaign'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/company/campaigns/{campaignId}/assets:
    post:
      summary: Upload campaign media to private storage for an owned draft campaign
      operationId: uploadCampaignAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignAssetUploadRequest'
      responses:
        '201':
          description: Campaign asset recorded with pending review status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCampaignAsset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/company/campaigns/{campaignId}/assets/{assetId}/replacement:
    post:
      summary: Replace a pending or rejected campaign asset on an owned draft campaign
      operationId: replaceCampaignAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignAssetUploadRequest'
      responses:
        '201':
          description: Replacement asset uploaded and linked while the prior asset is retained for audit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCampaignAsset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/company/campaigns/{campaignId}/assets/{assetId}:
    delete:
      summary: Delete a pending or rejected campaign asset from an owned draft campaign
      operationId: deleteCampaignAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '204':
          description: Asset deleted or marked for provider cleanup; approved assets are immutable and retained.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/files/{fileId}:
    get:
      summary: Get authorized short-lived signed access for a stored file
      operationId: getSignedFileAccess
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Signed file access returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeFileAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/company/campaigns/{campaignId}/target-preview:
    get:
      summary: Preview eligible priced doctors and estimated campaign cost
      operationId: previewCampaignTargets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Eligible target preview returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTargetPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/company/campaigns/{campaignId}/submit:
    post:
      summary: Submit campaign for admin review and reserve company funds
      operationId: submitCampaign
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Campaign submitted and funds reserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCampaignSubmission'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/company/campaigns/{campaignId}/queue-summary:
    get:
      summary: Get aggregate queue counts for an owned campaign
      operationId: getCompanyCampaignQueueSummary
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Aggregate queue counts returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeQueueSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/doctors/{doctorId}/price:
    put:
      summary: Set an approved doctor's positive price per message
      operationId: setDoctorPrice
      security:
        - bearerAuth: []
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDoctorPriceRequest'
      responses:
        '200':
          description: Doctor price updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeDoctorPrice'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/campaign-assets/{assetId}/review:
    post:
      summary: Approve or reject a campaign asset
      operationId: reviewCampaignAsset
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '200':
          description: Asset review decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCampaignAsset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/campaigns/{campaignId}/review:
    post:
      summary: Approve, reject, or return a submitted campaign for revision
      operationId: reviewCampaign
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '200':
          description: Campaign review decision recorded; approval creates queue rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCampaignReview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/admin/campaigns/{campaignId}/queue:
    get:
      summary: Inspect doctor-level queue rows for a campaign
      operationId: getAdminCampaignQueueRows
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Doctor-level queue rows returned for admin verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeQueueRows'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    ValidationError:
      description: Validation failure in standard envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeEmpty'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeEmpty'
    Forbidden:
      description: Authenticated user lacks the required role or ownership.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeEmpty'
    NotFound:
      description: Resource not found or not visible to caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeEmpty'
    ConflictError:
      description: Idempotency conflict or invalid state transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeEmpty'
    StorageUnavailable:
      description: Storage provider unavailable; no provider credentials or raw provider responses are exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeEmpty'
  schemas:
    EnvelopeEmpty:
      type: object
      required: [Code, Message, Data]
      properties:
        Code:
          type: integer
        Message:
          type: string
        Data:
          nullable: true
    EnvelopeCompanyWallet:
      allOf:
        - $ref: '#/components/schemas/EnvelopeEmpty'
        - type: object
          properties:
            Data:
              $ref: '#/components/schemas/CompanyWallet'
    EnvelopeMockPayment:
      allOf:
        - $ref: '#/components/schemas/EnvelopeEmpty'
        - type: object
          properties:
            Data:
              $ref: '#/components/schemas/MockPaymentResult'
    EnvelopeCampaign:
      allOf:
        - $ref: '#/components/schemas/EnvelopeEmpty'
        - type: object
          properties:
            Data:
              $ref: '#/components/schemas/Campaign'
    EnvelopeCampaignAsset:
      allOf:
        - $ref: '#/components/schemas/EnvelopeEmpty'
        - type: object
          properties:
            Data:
              $ref: '#/components/schemas/CampaignAsset'
    EnvelopeFileAccess:
      allOf:
        - $ref: '#/components/schemas/EnvelopeEmpty'
        - type: object
          properties:
            Data:
              $ref: '#/components/schemas/FileAccess'
    EnvelopeTargetPreview:
      allOf:
        - $ref: '#/components/schemas/EnvelopeEmpty'
        - type: object
          properties:
            Data:
              $ref: '#/components/schemas/TargetPreview'
    EnvelopeCampaignSubmission:
      allOf:
        - $ref: '#/components/schemas/EnvelopeEmpty'
        - type: object
          properties:
            Data:
              $ref: '#/components/schemas/CampaignSubmission'
    EnvelopeCampaignReview:
      allOf:
        - $ref: '#/components/schemas/EnvelopeEmpty'
        - type: object
          properties:
            Data:
              $ref: '#/components/schemas/CampaignReviewResult'
    EnvelopeDoctorPrice:
      allOf:
        - $ref: '#/components/schemas/EnvelopeEmpty'
        - type: object
          properties:
            Data:
              $ref: '#/components/schemas/DoctorPrice'
    EnvelopeQueueSummary:
      allOf:
        - $ref: '#/components/schemas/EnvelopeEmpty'
        - type: object
          properties:
            Data:
              $ref: '#/components/schemas/QueueSummary'
    EnvelopeQueueRows:
      allOf:
        - $ref: '#/components/schemas/EnvelopeEmpty'
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: '#/components/schemas/QueueRow'
    CompanyWallet:
      type: object
      required: [walletId, companyId, availableBalance, reservedBalance, currency]
      properties:
        walletId:
          type: string
        companyId:
          type: string
        availableBalance:
          type: number
          format: decimal
        reservedBalance:
          type: number
          format: decimal
        currency:
          type: string
          enum: [EGP]
    MockTopUpRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: decimal
          minimum: 0.01
        currency:
          type: string
          enum: [EGP]
    MockPaymentResult:
      type: object
      required: [paymentId, companyId, amount, status, createdAtUtc, transactionReference, walletBalanceBefore, walletBalanceAfter]
      properties:
        paymentId:
          type: string
        companyId:
          type: string
        amount:
          type: number
          format: decimal
        status:
          type: string
          enum: [Succeeded]
        createdAtUtc:
          type: string
          format: date-time
        transactionReference:
          type: string
        walletBalanceBefore:
          type: number
          format: decimal
        walletBalanceAfter:
          type: number
          format: decimal
    CreateCampaignDraftRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4000
        clinicalResearchInfo:
          type: string
          nullable: true
          maxLength: 4000
    Campaign:
      type: object
      required: [campaignId, companyId, title, description, status]
      properties:
        campaignId:
          type: string
        companyId:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [Draft, PendingReview, Approved, Rejected, Active, Paused, Completed, Cancelled]
    CampaignAssetUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    CampaignAsset:
      type: object
      required: [assetId, campaignId, reviewStatus, fileId]
      properties:
        assetId:
          type: string
        fileId:
          type: string
        campaignId:
          type: string
        reviewStatus:
          type: string
          enum: [Pending, Approved, Rejected]
        reviewReason:
          type: string
          nullable: true
        supersededByFileId:
          type: string
          nullable: true
    FileAccess:
      type: object
      additionalProperties: false
      required: [FileId, Url, ExpiresAtUtc]
      properties:
        FileId:
          type: string
        Url:
          type: string
          format: uri
        ExpiresAtUtc:
          type: string
          format: date-time
    TargetPreview:
      type: object
      required: [eligibleDoctorCount, estimatedTotalCost, currency]
      properties:
        eligibleDoctorCount:
          type: integer
          minimum: 0
        estimatedTotalCost:
          type: number
          format: decimal
        currency:
          type: string
          enum: [EGP]
    CampaignSubmission:
      type: object
      required: [campaignId, status, targetCount, reservedAmount]
      properties:
        campaignId:
          type: string
        status:
          type: string
          enum: [PendingReview]
        targetCount:
          type: integer
        reservedAmount:
          type: number
          format: decimal
    SetDoctorPriceRequest:
      type: object
      required: [pricePerMessage]
      properties:
        pricePerMessage:
          type: number
          format: decimal
          minimum: 0.01
        reason:
          type: string
          nullable: true
          maxLength: 500
    DoctorPrice:
      type: object
      required: [doctorId, pricePerMessage, currency]
      properties:
        doctorId:
          type: string
        pricePerMessage:
          type: number
          format: decimal
        currency:
          type: string
          enum: [EGP]
    ReviewDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [Approved, Rejected, ChangesRequested]
        reason:
          type: string
          nullable: true
          maxLength: 1000
    CampaignReviewResult:
      type: object
      required: [campaignId, decision, status, queuedCount]
      properties:
        campaignId:
          type: string
        decision:
          type: string
          enum: [Approved, Rejected, ChangesRequested]
        status:
          type: string
        queuedCount:
          type: integer
          minimum: 0
    QueueSummary:
      type: object
      required: [campaignId, queuedCount, activatedCount, cancelledCount, expiredCount]
      properties:
        campaignId:
          type: string
        queuedCount:
          type: integer
        activatedCount:
          type: integer
        cancelledCount:
          type: integer
        expiredCount:
          type: integer
    QueueRow:
      type: object
      required: [queueId, campaignId, doctorId, status, queuedAtUtc]
      properties:
        queueId:
          type: string
        campaignId:
          type: string
        doctorId:
          type: string
        status:
          type: string
          enum: [Queued, Activated, Cancelled]
        queuedAtUtc:
          type: string
          format: date-time
